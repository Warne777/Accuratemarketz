<style>
  :root{
    --black-void:#08080B;
    --black-panel:#131318;
    --black-panel-2:#1A1A22;
    --blue:#1652F0;
    --blue-bright:#3B6EFF;
    --blue-dim:#0D2E85;
    --red:#FF2E3B;
    --red-dim:#7A1015;
    --bone:#F5F3EE;
    --muted:#8A8A93;
    --muted-2:#57575F;
    --hairline:rgba(245,243,238,0.09);
    --hairline-strong:rgba(245,243,238,0.16);
    --good:#22C55E;
    --good-dim:#146C36;
    /* Primary structural accent — used for generic UI (buttons, focus states,
       selection, avatars). Blue/red/green stay reserved for meaning (yes/no,
       up/down, category identity) rather than doubling as decoration. */
    --grey-accent:#8A9099;
    --grey-accent-bright:#AEB4BD;
    --grey-accent-dim:#4A4E56;
  }
  html[data-theme="light"]{
    --grey-accent:#5B6069;
    --grey-accent-bright:#3A3E45;
    --grey-accent-dim:#C4C8CE;
    --black-void:#F3F3F6;
    --black-panel:#FFFFFF;
    --black-panel-2:#EFEFF3;
    --bone:#15151A;
    --muted:#55555F;
    --muted-2:#83838C;
    --hairline:rgba(15,15,25,0.09);
    --hairline-strong:rgba(15,15,25,0.16);
  }
  html[data-theme="light"] body{ background:var(--black-void); }
  html[data-theme="light"] .demo-banner{ background:#FFF7E0; color:#5c4600; border-color:#e8cf80; }
  html[data-theme="light"] ::selection{ background:var(--grey-accent-dim); color:var(--bone); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--black-void);color:var(--bone);overflow-x:hidden;max-width:100vw;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--grey-accent-dim);color:var(--bone);}

  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:rgba(8,8,11,0.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .brand-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .brand .logo-mark{height:22px;width:auto;display:block;flex-shrink:0;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-dim);flex-shrink:0;}
  .brand .name{font-weight:700;font-size:15px;letter-spacing:0.03em;white-space:nowrap;color:var(--bone);}
  .brand .name .accent{color:var(--muted);font-weight:500;}
  .user-chip{
    display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex-shrink:1;
    background:var(--black-panel);border:1px solid var(--hairline);
    border-radius:100px;padding:6px 12px;font-size:12.5px;
  }
  .user-chip .bal{
    font-family:'IBM Plex Mono',monospace;font-style:normal;font-weight:700;
    color:var(--good);letter-spacing:.01em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .money-block{display:inline;}
  .money-block-sp{display:inline;}

  .hamburger-btn{
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
    width:34px;height:34px;min-width:34px;background:var(--black-panel);border:1px solid var(--hairline-strong);
    border-radius:10px;margin-left:6px;flex-shrink:0;
  }
  .hamburger-btn span{display:block;width:15px;height:2px;background:var(--bone);border-radius:2px;}

  .menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;}
  .menu-panel{
    position:fixed;top:0;right:0;bottom:0;width:62%;max-width:150px;z-index:300;
    background:linear-gradient(180deg,#1A1D24,#0E0F13);
    border-left:1px solid var(--hairline-strong);
    padding:14px 10px;display:flex;flex-direction:column;gap:1px;overflow:hidden;
    box-shadow:-8px 0 24px rgba(0,0,0,.35);
    animation:slideIn .18s ease-out;
  }
  @keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .menu-panel-watermark{
    position:absolute;right:-36px;bottom:10px;width:170px;opacity:.16;filter:blur(4px);
    pointer-events:none;z-index:0;
  }
  .menu-user, .menu-item, .menu-divider{position:relative;z-index:1;}
  .menu-user{padding:6px 10px 12px;border-bottom:1px solid var(--hairline);margin-bottom:4px;}
  .menu-user-name{font-weight:700;font-size:13.5px;}
  .menu-user-bal{font-family:'IBM Plex Mono',monospace;font-style:normal;color:var(--good);font-size:12px;margin-top:2px;}
  .menu-item{
    display:flex;align-items:center;gap:7px;text-align:left;background:none;border:none;
    color:var(--bone);font-size:12px;font-weight:600;padding:8px 7px;border-radius:8px;
    line-height:1.25;
  }
  .menu-item:active{background:var(--black-panel-2);}
  .menu-divider{height:1px;background:var(--hairline);margin:4px 2px;}

  nav.tabs{
    display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--muted);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;
    white-space:nowrap;
  }
  nav.tabs button.active{background:var(--black-panel-2);color:var(--bone);}
  nav.tabs button.admin-tab{margin-left:auto;color:var(--red);border:1px solid var(--red-dim);}

  main{max-width:640px;margin:0 auto;padding:14px 14px 30px;}

  /* ================= RESPONSIVE LAYOUT =================
     Phones (default, <768px): unchanged — single column, cards stacked
     vertically, exactly as before, on every view.
     Tablets/laptops/TVs (768px+): ONLY the markets browsing view widens and
     arranges cards in a horizontal grid, closer to a trading-terminal /
     dashboard layout. Forms, wallet, admin and detail pages stay at their
     original comfortable reading width — stretching a deposit form or a
     stat card across a TV-sized screen would look broken, not "responsive". */
  @media (min-width:768px){
    main.wide{ max-width:920px; padding:20px 24px 40px; }
    .markets-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; align-items:start; }
    .markets-grid .card{ margin-bottom:0; }
  }
  @media (min-width:1100px){
    main.wide{ max-width:1280px; }
    .markets-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (min-width:1500px){
    main.wide{ max-width:1560px; }
    .markets-grid{ grid-template-columns:repeat(4, 1fr); }
  }

  /* ---------- Category pills ---------- */
  .cat-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px;margin-bottom:4px;}
  .tag-row .tag-pill{ font-size:11px; opacity:0.9; }

  /* Trending hero + Hot Topics — phones: stacked (hero, then list).
     Wide layout (tablet/laptop/TV): side by side, hero wider than the list. */
  .trending-layout{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .trending-hero{ cursor:pointer; }
  .hot-topics{ padding-top:14px; }
  .hot-topic-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--hairline); cursor:pointer; }
  .hot-topic-row:last-child{ border-bottom:none; }
  .ht-rank{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--muted-2); width:16px; flex-shrink:0; }
  .ht-name{ flex:1; font-size:13px; font-weight:600; }
  .ht-vol{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); flex-shrink:0; }
  @media (min-width:768px){
    main.wide .trending-layout{ flex-direction:row; align-items:stretch; }
    main.wide .trending-hero{ flex:1 1 62%; }
    main.wide .hot-topics{ flex:1 1 38%; }
    /* On phones, category/tag pills scroll horizontally (swipe) since there's

  /* ================= MOTION =================
     Deliberate, not decorative: the probability bar (this app's signature
     element) is the one thing that always animates meaningfully — its fill
     eases to the new price so a market's movement is felt, not just read.
     Everything else is quiet, functional feedback: views settle in instead
     of popping, cards arrive as a feed rather than all at once, buttons and
     modals respond to touch. All of it respects reduced-motion. */

  .prob-yes, .prob-no{ transition: width 0.7s cubic-bezier(.22,.9,.32,1); }

  main{ animation: viewIn 0.26s cubic-bezier(.22,.9,.32,1) both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .card{ animation: cardIn 0.36s cubic-bezier(.22,.9,.32,1) both; }

  .card{ transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }

  .btn:active{ transform:scale(.98); filter:brightness(.96); }

  .modal-bg{ animation: modalBgIn .22s ease both; }
  @keyframes modalBgIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-sheet{ animation: sheetIn .38s cubic-bezier(.22,1,.36,1) both; }

  @keyframes overduePulse{ 0%{ box-shadow:0 0 0 0 rgba(255,46,59,.28); } 60%,100%{ box-shadow:0 0 0 4px rgba(255,46,59,0); } }

  }

<script>
/* ================= RESILIENT LIBRARY LOADING =================
   Loads the Supabase JS library with automatic fallback across multiple
   CDNs. A single CDN (jsdelivr) can occasionally fail for a given visitor —
   blocked by a network/firewall, an ad-blocker rule, or a transient outage —
   so we try alternates before giving up, instead of failing sign-up outright. */
function loadScriptOnce(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.async = false;
    s.onload = ()=>resolve(url);
    s.onerror = ()=>reject(new Error('Failed to load script: '+url));
    document.head.appendChild(s);
  });
}
async function loadSupabaseLibrary(){
  if(window.supabase) return true;
  const sources = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2',
    'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js'
  ];
  for(const url of sources){
    if(window.supabase) return true;
    try{
      await loadScriptOnce(url);
      if(window.supabase) return true;
    }catch(e){
      console.warn('Supabase CDN failed, trying next source:', url, e);
    }
  }
  return !!window.supabase;
}

/* ================= SUPABASE CONFIG =================
   1. In Supabase: Project Settings -> API
   2. Copy "Project URL" and "anon public" key below
   3. Run supabase-setup.sql in the SQL Editor first (see chat)      */
const SUPABASE_URL = 'https://jtxdvbstxiwdrznodllm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6dtf3s8S9RAx08FN5K1uRQ_9rmhNnMO';
const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1';
// Flip to true only after the mpesa-* Edge Functions are deployed and their secrets are
// set (see the M-Pesa integration notes) — until then this stays safely simulated.
const MPESA_INTEGRATION_LIVE = false;
// Flip to true only after deploying the place-bet Edge Function (see mpesa-integration
// folder). Until then, betting stays on the existing client-side flow.
const SERVER_BETTING_LIVE = false;
let sb = null;
let sbInitError = null;
async function initSupabaseClient(){
  try{
    const loaded = await loadSupabaseLibrary();
    if(!loaded){
      sbInitError = 'Could not load the Supabase library from any CDN. Check your internet connection and try again — if this keeps happening on a specific network, that network may be blocking cdn.jsdelivr.net / unpkg.com / cdnjs.cloudflare.com.';
    } else if(!SUPABASE_URL.startsWith('http')){
      sbInitError = 'Supabase URL is not configured correctly.';
    } else {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          // The app now signs people in via the emailed "Sign in" link (PKCE flow) —
          // detectSessionInUrl lets the library complete that exchange automatically
          // when the person lands back on the site after tapping the link.
          detectSessionInUrl: true,
          flowType: 'pkce',
          persistSession: true,
          autoRefreshToken: true
        }
      });
    }
  }catch(e){
    console.error('Supabase client init failed', e);
    sbInitError = e && e.message ? e.message : String(e);
    sb = null;
  }
}

// Push admin/user changes to everyone already on the site, live — not just on next reload.
function startRealtimeSync(){
  if(!sb) return;
  try{
    sb.channel('app_state_changes')
      .on('postgres_changes', {event:'UPDATE', schema:'public', table:'app_state', filter:'id=eq.1'}, (payload)=>{
        if(payload.new && payload.new.data){
          S.data = payload.new.data;
          safeRenderAfterRemoteUpdate();
        }
      })
      .subscribe();
  }catch(e){ console.error('Realtime subscribe failed', e); }
}
// Avoid yanking focus or wiping unsaved text (e.g. an admin mid-edit) when a live update lands —
// wait until the person isn't actively typing, then render the fresh data.
function safeRenderAfterRemoteUpdate(){
  const active = document.activeElement;
  const isTyping = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
  if(isTyping){
    if(!S._pendingRemoteRender){
      S._pendingRemoteRender = true;
      const retry = ()=>{
        const a = document.activeElement;
        if(!(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){ S._pendingRemoteRender=false; render(); }
        else setTimeout(retry, 1500);
      };
      setTimeout(retry, 1500);
    }
    return;
  }
  render();
}

/* ================= HELPERS ================= */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
// Approximate, illustrative exchange rates for DISPLAY purposes only — not live market
// rates, and never used for anything that actually moves money. All real deposits,
// withdrawals, and betting always happen in KES via M-Pesa, regardless of display currency.
const CURRENCIES = {
  KES: { name:'Kenyan Shilling', symbol: 'KES', rate: 1,       locale:'en-KE' },
  USD: { name:'US Dollar',       symbol: '$',   rate: 0.0077,  locale:'en-US' },
  EUR: { name:'Euro',            symbol: '€',   rate: 0.0071,  locale:'en-US' },
  GBP: { name:'British Pound',   symbol: '£',   rate: 0.0060,  locale:'en-US' },
  UGX: { name:'Ugandan Shilling',symbol: 'USh', rate: 28.5,    locale:'en-US' },
  TZS: { name:'Tanzanian Shilling',symbol:'TSh',rate: 19.9,    locale:'en-US' },
  NGN: { name:'Nigerian Naira',  symbol: '₦',   rate: 12.1,    locale:'en-US' },
};
function fmtKESRaw(n){ n = Math.round(n); return 'KES ' + n.toLocaleString('en-KE'); }
function fmtMoney(n){
  const cur = CURRENCIES[S.currency] || CURRENCIES.KES;
  const converted = n * cur.rate;
  const decimals = cur.rate===1 ? 0 : 2;
  const formatted = converted.toLocaleString(cur.locale, {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
  return cur.symbol + ' ' + formatted;
}
function fmtKES(n){ return fmtMoney(n); } // display-currency-aware; use fmtKESRaw for literal M-Pesa amounts
// Renders a money string as individual boxed "cells", one per character — an original
// chunky arcade-scoreboard look, not tied to any particular font weight.
function moneyBlocks(str){
  return str.split('').map(ch=>{
    if(ch===' ') return '<span class="money-block money-block-sp"></span>';
    return `<span class="money-block">${escapeHtml(ch)}</span>`;
  }).join('');
}
function setCurrency(code){
  if(!CURRENCIES[code]) return;
  S.currency = code;
  try{ localStorage.setItem('am_currency', code); }catch(e){}
  render();
}
// A stylized modern banknote (not an emoji, not a photographic reproduction
// of any real currency's actual security-printed artwork) whose color,
// denomination, and code change with whichever currency is selected — KSh
// 1,000 for Kenyan Shillings, then a $100 note once switched to USD, and so
// on for every currency in CURRENCIES. Re-evaluated on every render, so it
// updates the instant setCurrency() runs. Built as SVG rather than a raster
// image: vector shapes are drawn from math, not a pixel grid, so this stays
// perfectly crisp at any size or screen density, with no upper resolution
// limit and a tiny file size.
const NOTE_STYLE = {
  KES: { denom:'1000', code:'KSH', bank:'CENTRAL BANK OF KENYA',    c1:'#2E8B57', c2:'#0B3B23', c3:'#DDEDCB' },
  USD: { denom:'100',  code:'USD', bank:'FEDERAL RESERVE',          c1:'#3C8D5C', c2:'#163823', c3:'#DCEFDD' },
  EUR: { denom:'50',   code:'EUR', bank:'EUROPEAN CENTRAL BANK',    c1:'#2E6DA4', c2:'#12314F', c3:'#D9E8F5' },
  GBP: { denom:'20',   code:'GBP', bank:'BANK OF ENGLAND',          c1:'#6B3FA0', c2:'#2E1B42', c3:'#E6DAF2' },
  UGX: { denom:'50000',code:'UGX', bank:'BANK OF UGANDA',           c1:'#B5762C', c2:'#4A2E12', c3:'#F3E3CB' },
  TZS: { denom:'10000',code:'TZS', bank:'BANK OF TANZANIA',         c1:'#1E8A8A', c2:'#073C3C', c3:'#D6F0EE' },
  NGN: { denom:'1000', code:'NGN', bank:'CENTRAL BANK OF NIGERIA',  c1:'#3A4E8C', c2:'#16213F', c3:'#DCE2F2' },
};
// Ticked engraved-style border — a ring of short radial ticks around the note,
// evoking the fine engraved borders real banknotes use, built from simple
// geometry rather than copying any actual note's artwork.
function noteTicks(cx, cy, rx, ry, count, len, color, uid){
  let out = '';
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2;
    const x1 = cx + Math.cos(a)*rx, y1 = cy + Math.sin(a)*ry;
    const x2 = cx + Math.cos(a)*(rx+len), y2 = cy + Math.sin(a)*(ry+len);
    out += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="0.35" opacity="0.5"/>`;
  }
  return out;
}
function noteIcon(){
  const n = NOTE_STYLE[S.currency] || NOTE_STYLE.KES;
  const uid = 'note'+Math.random().toString(36).slice(2,8);
  const denomSize = n.denom.length>=5 ? 10 : n.denom.length===4 ? 12 : 14.5;
  const bankSize = n.bank.length>22 ? 2.6 : 3;
  return `<svg viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="${n.c1}"/>
        <stop offset="100%" stop-color="${n.c2}"/>
      </linearGradient>
      <radialGradient id="${uid}emblem" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="${n.c3}" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="${n.c3}" stop-opacity="0.1"/>
      </radialGradient>
      <filter id="${uid}shadow" x="-20%" y="-30%" width="140%" height="160%">
        <feDropShadow dx="0" dy="0.7" stdDeviation="0.8" flood-color="#000" flood-opacity="0.35"/>
      </filter>
    </defs>
    <g filter="url(#${uid}shadow)">
      <rect x="1" y="1" width="62" height="30" rx="3" fill="url(#${uid}bg)"/>
      <!-- ghost watermark numeral -->
      <text x="32" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="20" fill="${n.c3}" opacity="0.09">${escapeHtml(n.denom)}</text>
      <!-- double engraved frame -->
      <rect x="2.5" y="2.5" width="59" height="27" rx="2.5" fill="none" stroke="${n.c3}" stroke-width="0.7" opacity="0.6"/>
      <rect x="4" y="4" width="56" height="24" rx="2" fill="none" stroke="${n.c3}" stroke-width="0.35" opacity="0.4"/>
      <g opacity="0.45" stroke="${n.c3}" stroke-width="0.3">
        <path d="M4 8.5 h56 M4 23.5 h56"/>
      </g>
      <!-- guilloché rosette (geometric, not a portrait) -->
      <g opacity="0.85">
        ${noteTicks(46,16,7.4,7.4,28,1.6,n.c3,uid)}
        <circle cx="46" cy="16" r="7.4" fill="url(#${uid}emblem)" stroke="${n.c3}" stroke-width="0.4" opacity="0.7"/>
        <circle cx="46" cy="16" r="5.2" fill="none" stroke="${n.c3}" stroke-width="0.4" opacity="0.55"/>
        <circle cx="46" cy="16" r="3" fill="none" stroke="${n.c3}" stroke-width="0.35" opacity="0.6"/>
        <circle cx="46" cy="16" r="1.1" fill="${n.c3}" opacity="0.8"/>
      </g>
      <text x="6" y="7.2" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="${bankSize}" letter-spacing="0.25" fill="${n.c3}" opacity="0.9">${escapeHtml(n.bank)}</text>
      <text x="6" y="20" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="${denomSize}" fill="${n.c3}">${escapeHtml(n.denom)}</text>
      <text x="6" y="27" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="5" letter-spacing="0.5" fill="${n.c3}" opacity="0.85">${escapeHtml(n.code)}</text>
    </g>
  </svg>`;
}
function setLang(code){
  if(!TRANSLATIONS[code]) return;
  S.lang = code;
  try{ localStorage.setItem('am_lang', code); }catch(e){}
  render();
}
function toggleBalanceVisibility(){
  S.balanceHidden = !S.balanceHidden;
  try{ localStorage.setItem('am_balance_hidden', S.balanceHidden?'true':'false'); }catch(e){}
  render();
}
function setTheme(theme){
  S.theme = theme==='light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  try{ localStorage.setItem('am_theme', S.theme); }catch(e){}
  render();
}
function toggleTheme(){ setTheme(S.theme==='light' ? 'dark' : 'light'); }
function toggleMenu(){ S.menuOpen = !S.menuOpen; render(); }
function closeMenuAnd(fn){ S.menuOpen = false; fn(); }
function t(key){
  return (TRANSLATIONS[S.lang]&&TRANSLATIONS[S.lang][key]) || TRANSLATIONS.en[key] || key;
}
function fmtPct(p){ return Math.round(p) + '%'; }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const d = new Date(iso); return d.toLocaleDateString('en-KE',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function mockMpesaCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='S';
  for(let i=0;i<8;i++) c+=chars[Math.floor(Math.random()*chars.length)];

/* ================= SEED DATA ================= */
function seedData(){
  const now = Date.now();
  const day = 86400000;
  function mk(question, category, prob, closesInDays, volume, image){
    // Build a realistic multi-point history (small random-walk steps converging
    // on the final prob) instead of a flat 2-point line — so the demo markets
    // actually look like something has been happening, not a static chart.
    const points = 12;
    const history = [];
    let p = clamp(prob + (Math.random()*16-8), 5, 95);
    for(let i=0;i<points;i++){
      const t = now - day*10 + (i/(points-1))*day*10;
      const pull = (prob - p) * 0.35;
      p = clamp(p + pull + (Math.random()*8-4), 3, 97);
      history.push({t, prob: Math.round(p)});
    }
    history[history.length-1] = {t: now, prob};
    return {
      id: uid('mkt'),
      question, category, prob,
      status: 'open',
      outcome: null,
      volume,
      image: image || null,
      featured: false,
      comments: [],
      createdAt: new Date(now - day*2).toISOString(),
      closesAt: new Date(now + day*closesInDays).toISOString(),
      resolveBy: null,
      history
    };
  }
  const seeded = {
    markets: [
      mk("Will the ruling coalition retain a parliamentary majority after Kenya's 2027 general election?", 'Politics', 54, 300, 812400),
      mk("Will Harambee Stars qualify for AFCON 2027?", 'Sports', 61, 150, 456200),
      mk("Will Gor Mahia win the 2026/27 FKF Premier League title?", 'Sports', 38, 200, 298750),
      mk("Will the CBK Central Bank Rate fall below 9% by 31 Dec 2026?", 'Economy', 44, 90, 673100),
      mk("Will the Kenya Shilling trade below KES 120 to the US Dollar by 31 Dec 2026?", 'Economy', 29, 90, 512300),
      mk("Will Nairobi County record above-average rainfall in the 2026 short rains (Oct–Dec)?", 'Weather', 47, 100, 187900),
      mk("Will the pump price of Super Petrol in Nairobi exceed KES 200/litre before 1 Oct 2026?", 'Economy', 33, 60, 341600),
      mk("Will a Kenyan film win a major award at FESPACO 2027?", 'Entertainment', 22, 260, 94500),
    ],
    transactions: [],
    users: {},
    proposals: [],
    auditLog: [],
    leaderboardOverrides: {}, // phone -> {displayName, statOverride, pinnedRank} — admin-only display tweaks
    settings: {
      // Hashed PINs only — never store or display raw PINs.
      // Default main PIN is 2580; change it immediately from Admin → Settings.
      adminPinHash: 'ed946f65d2c785d90e827c5ffd879ce3b49c68d4c88013074176a7e73bc58bcf',
      juniorAdmins: [
        {id:'jr1', label:'Junior Admin 1', pinHash:null},
        {id:'jr2', label:'Junior Admin 2', pinHash:null},
        {id:'jr3', label:'Junior Admin 3', pinHash:null},
        {id:'jr4', label:'Junior Admin 4', pinHash:null},
        {id:'jr5', label:'Junior Admin 5', pinHash:null}
      ]
    }
  };
  seeded.markets[0].featured = true;
  return seeded;
}

/* ================= HASHING (PINs are never stored or shown in plaintext) ================= */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ================= STORAGE (Supabase + localStorage) ================= */
async function loadAll(){
  if(!navigator.onLine){
    // No point attempting a network call, and we don't want to silently fall back to
    // fake local seed data while offline — that would look like a working app when
    // it isn't. Show the "you're offline" block immediately instead.
    S.isOnline = false;
    S.loading = false;
    render();
    return;
  }
  try{
    if(!sb){
      console.warn('Supabase not configured or failed to load — using local seed data only (changes won\'t be saved).');
      S.data = seedData();
      S.loadError = 'Running in offline demo mode — changes won\'t be saved, and sign-up (which needs a live connection) won\'t work. Reason: '+(sbInitError||'unknown');
    } else {
      try{
        let { data, error } = await sb.from('app_state').select('data').eq('id',1).single();
        if(error || !data || !data.data || Object.keys(data.data).length===0){
          const seed = seedData();
          await sb.from('app_state').upsert({ id:1, data: seed });
          S.data = seed;
        } else {
          S.data = data.data;
        }
      }catch(e){
        console.error('Supabase load failed, falling back to local seed', e);
        S.data = seedData();
      }
    }
    await migrateSettingsIfNeeded();
    await restoreAuthSession();
    try{
      const raw = localStorage.getItem('am_session');
      S.session = raw ? JSON.parse(raw) : null;
    }catch(e){ S.session = null; }
    // If there's no local session but a real verified auth session exists (e.g. new
    // device, or localStorage was cleared), try to reattach to the linked profile.
    if(!S.session && S.authSession){
      const email = (S.authSession.user.email||'').toLowerCase();
      const existing = Object.values(S.data.users).find(u => u.email && u.email.toLowerCase()===email);
      if(existing){ S.session = { name: existing.name, phone: existing.phone }; await persistSession(); }
    }
    if(!S.session){ S.onboarding = true; }
    try{
      const savedCur = localStorage.getItem('am_currency');
      if(savedCur && CURRENCIES[savedCur]) S.currency = savedCur;
      const savedLang = localStorage.getItem('am_lang');
      if(savedLang && TRANSLATIONS[savedLang]) S.lang = savedLang;
      S.balanceHidden = localStorage.getItem('am_balance_hidden')==='true';
      const savedTheme = localStorage.getItem('am_theme');
      if(savedTheme==='light'||savedTheme==='dark') S.theme = savedTheme;
      document.documentElement.setAttribute('data-theme', S.theme);
    }catch(e){}
    try{
      const role = localStorage.getItem('am_admin_role');
      if(role === 'main'){
        S.role = 'main'; S.juniorId = null;
      } else if(role === 'junior'){
        const jid = localStorage.getItem('am_admin_junior_id');
        // Re-validate the junior slot still exists and is still active before trusting the session.
        const stillValid = jid && (S.data.settings.juniorAdmins||[]).some(j => j.id===jid && j.pinHash);
        if(stillValid){ S.role='junior'; S.juniorId=jid; }
        else { S.role=null; S.juniorId=null; localStorage.removeItem('am_admin_role'); localStorage.removeItem('am_admin_junior_id'); }
      } else {
        S.role = null; S.juniorId = null;
      }
    }catch(e){ S.role = null; S.juniorId = null; }
  }catch(fatal){
    console.error('Fatal load error', fatal);
    S.data = S.data || seedData();
    S.loadError = 'Something went wrong loading live data. You can still browse with local demo data — refresh to retry.';
  }
  S.loading = false;
  render();
  startRealtimeSync();
}

// Re-pulls the latest shared data without touching session/preferences — used whenever
// we can't fully trust that realtime push alone has kept us current (reconnecting after
// being offline, the tab/app coming back to the foreground, or just as a periodic safety
// net in case the realtime subscription silently dropped).
async function refreshData(){
  if(!sb || !navigator.onLine) return;
  try{
    let { data, error } = await sb.from('app_state').select('data').eq('id',1).single();
    if(!error && data && data.data && Object.keys(data.data).length>0){
      S.data = data.data;
      safeRenderAfterRemoteUpdate();

  }catch(e){ console.error('Background refresh failed', e); }

async function migrateSettingsIfNeeded(){
  let dirty = false;
  const st = S.data.settings || (S.data.settings = {});
  // Old deployments stored a raw plaintext PIN — upgrade it to a hash and drop the plaintext.
  if(!st.adminPinHash && st.adminPin){
    st.adminPinHash = await sha256Hex(String(st.adminPin));
    delete st.adminPin;
    dirty = true;
  }
  if(!st.adminPinHash){
    st.adminPinHash = 'ed946f65d2c785d90e827c5ffd879ce3b49c68d4c88013074176a7e73bc58bcf'; // default 2580
    dirty = true;
  }
  if(!Array.isArray(st.juniorAdmins)){
    st.juniorAdmins = [1,2,3,4,5].map(n=>({id:'jr'+n, label:'Junior Admin '+n, pinHash:null}));
    dirty = true;
  }
  if(!Array.isArray(S.data.proposals)){ S.data.proposals = []; dirty = true; }
  if(!Array.isArray(S.data.auditLog)){ S.data.auditLog = []; dirty = true; }
  if(!S.data.leaderboardOverrides || typeof S.data.leaderboardOverrides!=='object'){ S.data.leaderboardOverrides = {}; dirty = true; }
  // Older markets predate the image/featured fields — backfill sensible defaults.
  (S.data.markets||[]).forEach(m=>{
    if(m.image === undefined){ m.image = null; dirty = true; }
    if(m.featured === undefined){ m.featured = false; dirty = true; }
    if(!Array.isArray(m.comments)){ m.comments = []; dirty = true; }
  });
  // Older users predate the referral programme — backfill required fields.
  Object.values(S.data.users||{}).forEach(u=>{
    if(!u.referralCode){ u.referralCode = genReferralCode(); dirty = true; }
    if(u.referredBy === undefined){ u.referredBy = null; dirty = true; }
    if(u.referralRewardGiven === undefined){ u.referralRewardGiven = false; dirty = true; }
    if(u.totalDeposited === undefined){
      // Backfill from transaction history so existing depositors aren't penalized.
      u.totalDeposited = (S.data.transactions||[]).filter(t=>t.phone===u.phone && t.type==='deposit' && t.status==='completed').reduce((a,t)=>a+t.amount,0);
      dirty = true;
    }
    if(u.hasPlacedBet === undefined){ u.hasPlacedBet = (u.bets||[]).length>0; dirty = true; }
    if(u.referralEarnings === undefined){ u.referralEarnings = 0; dirty = true; }
    if(u.referralCount === undefined){ u.referralCount = 0; dirty = true; }
    if(!u.joinedAt){ u.joinedAt = u.bets && u.bets[0] ? u.bets[0].createdAt : new Date().toISOString(); dirty = true; }
    if(u.email === undefined){ u.email = null; dirty = true; }
    if(u.authUserId === undefined){ u.authUserId = null; dirty = true; }
  });
  if(dirty) await persistData();
}

/* ================= BETTING ================= */
// A market stops accepting new bets the instant its closing time passes — even though
// an admin still needs to resolve it afterward to actually pay out winners. This is
// computed live from the clock, not a stored flag, so it's correct on every device
// the moment the deadline hits, with no server round-trip needed.
function hasClosingTimePassed(m){ return new Date(m.closesAt).getTime() <= Date.now(); }
function isBettable(m){ return m && m.status==='open' && !hasClosingTimePassed(m); }
function hasResolutionTimePassed(m){ return !!m.resolveBy && new Date(m.resolveBy).getTime() <= Date.now(); }
function marketDisplayStatus(m){
  if(m.status!=='open') return 'settled';
  if(!hasClosingTimePassed(m)) return 'open';
  return hasResolutionTimePassed(m) ? 'overdue' : 'awaiting';
}
// Re-renders automatically at the exact moment the next open market's deadline hits,
// so cards flip from OPEN to CLOSED live without anyone needing to refresh or interact.
// This covers BOTH the closing-time deadline (bets stop) and the resolution-time
// deadline (market flips to "overdue" so the admin sees it needs settling) — whichever
// of the two comes next across all open markets is what schedules the next tick.
let nextCloseTimer = null;
function scheduleNextMarketCloseCheck(){
  if(nextCloseTimer) clearTimeout(nextCloseTimer);
  if(!S.data || !S.data.markets) return;
  const upcoming = S.data.markets
    .filter(m=>m.status==='open')
    .flatMap(m=>{
      const times = [];
      if(!hasClosingTimePassed(m)) times.push(new Date(m.closesAt).getTime());
      if(m.resolveBy && !hasResolutionTimePassed(m)) times.push(new Date(m.resolveBy).getTime());
      return times;
    })
    .sort((a,b)=>a-b);
  if(!upcoming.length) return;
  const delay = Math.min(upcoming[0] - Date.now() + 250, 2147000000); // +250ms safety margin, capped to setTimeout's max
  nextCloseTimer = setTimeout(()=>{ render(); scheduleNextMarketCloseCheck(); }, Math.max(250, delay));
}

function priceFor(market, side){
  const p = side==='yes' ? market.prob : (100-market.prob);
  return clamp(p,2,98)/100;
}
// Total KES ever staked on each side of a market — counts every bet placed (open, won,
// lost, or refunded), since it answers "how much money did people put on YES vs NO".
function marketSideVolumes(marketId){
  let yes = 0, no = 0;
  Object.values(S.data.users).forEach(u=>{
    (u.bets||[]).forEach(b=>{
      if(b.marketId!==marketId) return;
      if(b.side==='yes') yes += b.stake; else no += b.stake;
    });
  });
  return { yes, no };
}
function potentialPayout(stake, price){ return stake/price; }
function netCreditOnWin(stake, price){
  const payout = potentialPayout(stake, price);
  const net = payout - stake;
  const fee = net>0 ? net*0.05 : 0;
  return payout - fee;
}

async function placeBet(){
  const market = S.data.markets.find(m=>m.id===S.selectedMarketId);
  const user = currentUser();
  const stake = parseFloat(S.betStake);
  if(!isBettable(market)){ showToast('This market is closed.'); render(); return; }
  if(!stake || stake < 20){ showToast('Minimum stake is KES 20'); return; }
  if(stake > user.balance){ showToast('Insufficient wallet balance'); return; }

  if(SERVER_BETTING_LIVE){
    if(!S.authSession){ showToast('Verify your email to place a bet'); return; }
    showToast('Placing bet…');
    try{
      const res = await fetch(FUNCTIONS_URL+'/place-bet', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+S.authSession.access_token},
        body: JSON.stringify({ marketId: market.id, side: S.betSide, stake })
      });
      const json = await res.json();
      if(!res.ok || json.error) throw new Error(json.error || 'Bet failed');
      S.betStake='';
      showToast('Bet placed — good luck! 🎯');
      goto('mybets'); // realtime sync fills in the confirmed bet/balance moments later
    }catch(e){
      showToast('Could not place bet: '+e.message);
    }
    return;
  }

  // Client-side fallback — used until SERVER_BETTING_LIVE is switched on.
  const price = priceFor(market, S.betSide);
  const payout = potentialPayout(stake, price);

  user.balance -= stake;
  user.bets.push({
    id: uid('bet'), marketId: market.id, question: market.question,
    side: S.betSide, stake, priceAtBet: price, potentialPayout: payout,
    status: 'open', createdAt: new Date().toISOString()
  });
  S.data.transactions.push({
    id: uid('tx'), phone: user.phone, name: user.name, type:'bet',
    amount: -stake, status:'completed', note: (S.betSide==='yes'?'YES':'NO')+' · '+market.question,
    createdAt: new Date().toISOString()
  });

  market.volume += stake;
  const nudge = clamp(Math.round(stake/3000),1,4);
  market.prob = clamp(market.prob + (S.betSide==='yes'?nudge:-nudge), 3, 97);
  market.history.push({t: Date.now(), prob: market.prob});

  user.hasPlacedBet = true;
  await checkReferralReward(user);
  await persistData();
  S.betStake='';
  showToast('Bet placed — good luck! 🎯');
  goto('mybets');
}

async function startDeposit(){

      S.mpesaStage = 'confirm';

      // Safaricom's callback updates app_state directly; our existing realtime subscription

    }catch(e){
      S.mpesaStage = null;

  // Simulated fallback — used until MPESA_INTEGRATION_LIVE is switched on.

  setTimeout(async ()=>{

    S.data.transactions.push({
      id: uid('tx'), phone:user.phone, name:user.name, type:'deposit',
      amount: amt, status:'completed', mpesaCode: code, note:'M-Pesa STK deposit (simulated)',

    });

    await persistData();

// Polls briefly for the real deposit to land (backstop in case realtime is momentarily
// delayed) — checks whether a new completed deposit transaction for this phone/amount
// has appeared in S.data since the STK push was sent.
function watchForDepositConfirmation(phone, amt){
  const seenBefore = S.data.transactions.filter(t=>t.phone===phone && t.type==='deposit' && t.status==='completed').length;
  let tries = 0;
  const check = ()=>{
    tries++;
    const nowCount = S.data.transactions.filter(t=>t.phone===phone && t.type==='deposit' && t.status==='completed').length;
    if(nowCount > seenBefore){
      S.mpesaStage = 'done';
      render();
      return;
    }
    if(S.mpesaStage!=='confirm') return; // user closed the modal or it already resolved
    if(tries > 40){ // ~2 minutes
      showToast('Still waiting on M-Pesa — check your phone, or try again.');
      return;
    }
    setTimeout(check, 3000);
  };
  setTimeout(check, 3000);
}

  render();

/* ================= REAL AUTH: EMAIL + OTP (Supabase Auth) ================= */
// This is Phase 1 of moving off the old "type any name/phone, get an account" flow.
// It proves the person controls the email before any profile is created or restored.
// Balances/bets still live in the shared data blob for now (Phase 2 moves that server-side).
// People tap the "Sign in" link in the email rather than typing a code — one less
// step, and it avoids needing to customise Supabase's email templates at all.
async function sendSignInLink(email){
  if(!sb){
    showToast('Connecting… retrying now');
    await initSupabaseClient();
    if(!sb){
      showToast(sbInitError ? ('Connection issue: '+sbInitError) : 'Not connected — try again in a moment');
      return;
    }
  }
  const clean = (email||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)){ showToast('Enter a valid email address'); return; }
  S.otpEmail = clean;
  showToast('Sending link…');
  try{
    const { error } = await sb.auth.signInWithOtp({
      email: clean,
      options: { shouldCreateUser: true, emailRedirectTo: window.location.origin }
    });
    if(error) throw error;
    S.otpStage = 'waiting';
    showToast('Link sent — check your email on this device');
    render();
  }catch(e){
    showToast('Could not send link: '+e.message);
  }
}
// Kept as a fallback: if the email template is ever changed to include {{ .Token }}
// again, typing the code still works through this path.
async function verifyOtpCode(code){
  if(!sb) return;
  const clean = (code||'').trim();
  if(clean.length<6){ showToast('Enter the 6-digit code'); return; }
  try{
    const { data, error } = await sb.auth.verifyOtp({ email: S.otpEmail, token: clean, type: 'email' });
    if(error) throw error;
    await completeEmailSignIn(data.session);
  }catch(e){
    showToast('Invalid or expired code: '+e.message);
  }
}
// Shared by both the link flow (auth-state-change) and the code fallback above —
// signs straight back into an existing profile if this email is already linked to
// one, otherwise leaves onboarding open just past the email step (name/phone still
// needed once, the first time).
async function completeEmailSignIn(session){
  if(!session) return;
  S.authSession = session;
  const email = (session.user && session.user.email || '').toLowerCase();
  S.otpEmail = email || S.otpEmail;
  const existing = email ? Object.values(S.data.users).find(u => u.email && u.email.toLowerCase()===email) : null;
  if(existing){
    S.session = { name: existing.name, phone: existing.phone };
    await persistSession();
    S.onboarding = false;
  }
  S.otpStage = null; S.otpCodeInput = '';
  showToast('Email verified');
  render();
}
async function restoreAuthSession(){
  if(!sb) return;
  try{
    const { data } = await sb.auth.getSession();
    if(data.session) await completeEmailSignIn(data.session);
    sb.auth.onAuthStateChange((event, session)=>{
      if(event==='SIGNED_IN' && session) completeEmailSignIn(session);
      S.authSession = session;
    });
  }catch(e){ console.error('Auth session restore failed', e); }
}

// Slows down brute-force PIN guessing: after repeated wrong attempts, lock out for a
// growing cooldown. This is enforced in this browser/session — it raises the bar for
// casual guessing through the UI, but is not a substitute for server-side rate limiting.
function adminLockoutStatus(){
  let s; try{ s = JSON.parse(localStorage.getItem('am_admin_lockout')||'{}'); }catch(e){ s = {}; }
  return { fails: s.fails||0, until: s.until||0 };
}
function recordAdminLoginFailure(){
  const s = adminLockoutStatus();
  const fails = s.fails+1;
  const cooldownSec = Math.min(300, Math.pow(2, Math.max(0,fails-3))*5); // grows after the 3rd miss, caps at 5 min
  const until = fails>3 ? Date.now()+cooldownSec*1000 : 0;
  try{ localStorage.setItem('am_admin_lockout', JSON.stringify({fails, until})); }catch(e){}
}
function clearAdminLoginFailures(){
  try{ localStorage.removeItem('am_admin_lockout'); }catch(e){}
}
async function tryAdminLogin(){
  const lock = adminLockoutStatus();
  if(lock.until > Date.now()){
    showToast('Too many wrong PINs — try again in '+Math.ceil((lock.until-Date.now())/1000)+'s');
    return;
  }
  const pin = S.adminPinInput;
  if(!pin){ showToast('Enter a PIN'); return; }
  const hash = await sha256Hex(pin);
  const settings = S.data.settings;
  if(hash === settings.adminPinHash){
    clearAdminLoginFailures();
    S.role = 'main'; S.juniorId = null;
    try{ localStorage.setItem('am_admin_role','main'); localStorage.removeItem('am_admin_junior_id'); }catch(e){}
    S.adminPinInput='';
    logAdminAction('Logged in', '');
    await persistData();
    goto('admin');
    return;
  }
  const junior = (settings.juniorAdmins||[]).find(j => j.pinHash && j.pinHash === hash);
  if(junior){
    clearAdminLoginFailures();
    S.role = 'junior'; S.juniorId = junior.id;
    try{ localStorage.setItem('am_admin_role','junior'); localStorage.setItem('am_admin_junior_id', junior.id); }catch(e){}
    S.adminPinInput='';
    logAdminAction('Logged in', '');
    await persistData();
    goto('admin');
    return;
  }
  recordAdminLoginFailure();
  if(!Array.isArray(S.data.auditLog)) S.data.auditLog = [];
  S.data.auditLog.unshift({ id: uid('log'), actor:'Unknown', action:'Failed PIN attempt', detail:'', at: new Date().toISOString() });
  await persistData();
  showToast('Incorrect PIN');
}
function adminLogout(){
  S.role = null; S.juniorId = null;
  try{ localStorage.removeItem('am_admin_role'); localStorage.removeItem('am_admin_junior_id'); }catch(e){}
  showToast('Logged out of admin');
  goto('dashboard');
}

/* ================= LEADERBOARD ================= */
function leaderboardCutoff(period){
  return Date.now() - (period==='month'?30:7)*86400000;
}
// Real numbers first: sums each user's actual bet activity in the window. "Realistic" means
// this is computed from genuine bets/payouts, not invented — admin overrides (below) only
// adjust what's *displayed*, layered on top of this real base.
function computeLeaderboardBase(period, metric){
  const cutoff = leaderboardCutoff(period);
  const rows = [];
  Object.values(S.data.users).forEach(u=>{
    let stat = 0;
    (u.bets||[]).forEach(b=>{
      if(new Date(b.createdAt).getTime() < cutoff) return;
      if(metric==='volume') stat += b.stake;
      else if(b.status==='won') stat += (b.payout - b.stake);
      else if(b.status==='lost') stat -= b.stake;
    });
    if(stat !== 0) rows.push({ phone:u.phone, name:u.name, stat });
  });
  return rows;
}
function computeLeaderboard(period, metric){
  const base = computeLeaderboardBase(period, metric);
  const overrides = S.data.leaderboardOverrides || {};
  let rows = base.map(r=>{
    const ov = overrides[r.phone];
    return {
      phone: r.phone,
      name: (ov && ov.displayName) ? ov.displayName : r.name,
      stat: (ov && ov.statOverride!=null && ov.statOverride!=='') ? Number(ov.statOverride) : r.stat,
      pinnedRank: ov ? ov.pinnedRank : null,
    };
  });
  // Admin can also feature someone manually even with no natural activity this period.
  Object.keys(overrides).forEach(phone=>{
    const ov = overrides[phone];
    if(!rows.find(r=>r.phone===phone) && ov.statOverride!=null && ov.statOverride!==''){
      const u = S.data.users[phone];
      rows.push({ phone, name: ov.displayName || (u?u.name:'Unknown'), stat: Number(ov.statOverride), pinnedRank: ov.pinnedRank });
    }
  });
  rows.sort((a,b)=>b.stat-a.stat);
  rows = rows.slice(0,10);
  rows.filter(r=>r.pinnedRank).forEach(r=>{
    const target = clamp(parseInt(r.pinnedRank)||1,1,10)-1;
    const idx = rows.indexOf(r);
    if(idx>-1){ rows.splice(idx,1); rows.splice(Math.min(target,rows.length),0,r); }
  });
  return rows.slice(0,10);
}

// Reads a chosen photo, downsizes/compresses it in the browser (so it stays light to
// load and fits comfortably in the shared database row), and stores it as the market's image.
function handleMarketImageFile(inputEl, target){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      if(target==='newMarket') S.newMarket.image = dataUrl;
      else if(target==='edit') S.editImageDraft = dataUrl;
      render();
    };
    img.onerror = ()=>showToast('Could not read that image — try a different file');
    img.src = e.target.result;
  };
  reader.onerror = ()=>showToast('Could not read that file');
  reader.readAsDataURL(file);
}

async function resolveMarket(marketId, outcome){
  if(!isAdmin()) return;
  const market = S.data.markets.find(m=>m.id===marketId);
  if(!market) return;
  if(!confirm('Resolve "'+market.question+'" as '+outcome.toUpperCase()+'? This will settle all bets and cannot be undone.')) return;
  market.status='settled';
  market.outcome=outcome;
  market.settledAt = new Date().toISOString();
  Object.values(S.data.users).forEach(u=>{
    u.bets.forEach(bet=>{
      if(bet.marketId!==marketId || bet.status!=='open') return;
      if(outcome==='cancel'){
        u.balance += bet.stake;
        bet.status='refunded';
        S.data.transactions.push({id:uid('tx'),phone:u.phone,name:u.name,type:'refund',amount:bet.stake,status:'completed',note:'Market cancelled: '+market.question,createdAt:new Date().toISOString()});
      } else if(bet.side===outcome){
        const net = bet.potentialPayout - bet.stake;
        const fee = net>0? net*0.05:0;
        const credit = bet.potentialPayout - fee;
        u.balance += credit;
        bet.status='won'; bet.payout=credit;
        S.data.transactions.push({id:uid('tx'),phone:u.phone,name:u.name,type:'payout',amount:credit,status:'completed',note:'Won bet: '+market.question,createdAt:new Date().toISOString()});
      } else {
        bet.status='lost';
      }
    });
  });
  logAdminAction('Resolved market as '+outcome.toUpperCase(), market.question.slice(0,60));
  await persistData();
  showToast('Market settled');
  render();
}
/* ================= PLATFORM FUNDS (main admin's own M-Pesa till) ================= */
// This is real M-Pesa money the platform has actually collected — separate from what
// individual users still see as their wallet balance (an internal ledger promise).
function platformFundsSummary(){
  const tx = S.data.transactions;
  const totalDeposited = tx.filter(t=>t.type==='deposit' && t.status==='completed').reduce((a,t)=>a+t.amount,0);
  const totalUserWithdrawals = tx.filter(t=>t.type==='withdrawal' && t.status==='completed').reduce((a,t)=>a+Math.abs(t.amount),0);
  const totalAdminSweeps = tx.filter(t=>t.type==='admin_sweep').reduce((a,t)=>a+Math.abs(t.amount),0);
  const pendingWithdrawals = tx.filter(t=>t.type==='withdrawal' && t.status==='pending').reduce((a,t)=>a+Math.abs(t.amount),0);
  const totalUserWalletBalances = Object.values(S.data.users).reduce((a,u)=>a+(u.balance||0),0);
  const collected = totalDeposited - totalUserWithdrawals - totalAdminSweeps; // real cash still sitting in the till
  const owedToUsers = totalUserWalletBalances + pendingWithdrawals; // what users could still ask to withdraw
  return { totalDeposited, totalUserWithdrawals, totalAdminSweeps, pendingWithdrawals, totalUserWalletBalances, collected, owedToUsers };
}
async function adminWithdrawPlatformFunds(amountStr){
  if(!requireMainAdmin()) return;
  const amount = parseFloat(amountStr);
  if(!amount || amount <= 0){ showToast('Enter a valid amount'); return; }
  const f = platformFundsSummary();
  if(amount > f.collected){
    if(!confirm('Only KES '+f.collected.toLocaleString()+' has actually been collected and not yet paid out or swept. Withdrawing KES '+amount.toLocaleString()+' will dip into money users still have in their wallets. Continue anyway?')) return;
  } else if(amount > (f.collected - f.owedToUsers)){
    if(!confirm('Heads up: users are currently holding KES '+f.owedToUsers.toLocaleString()+' in wallet balances / pending withdrawals. Sweeping KES '+amount.toLocaleString()+' now may leave less than that available if they all cash out. Continue?')) return;
  }
  S.data.transactions.push({
    id: uid('tx'), phone:'ADMIN', name:'Main admin', type:'admin_sweep',
    amount: -amount, status:'completed', mpesaCode: mockMpesaCode(),
    note: 'Platform funds swept to main admin M-Pesa account',
    createdAt: new Date().toISOString()
  });
  logAdminAction('Swept platform funds', 'KES '+amount.toLocaleString()+' to main admin M-Pesa');
  await persistData();
  S.adminSweepAmt = '';
  showToast('KES '+amount.toLocaleString()+' sent to your M-Pesa');
  render();
}
async function approveWithdrawal(txId){
  if(!requireMainAdmin()) return;
  const tx = S.data.transactions.find(t=>t.id===txId);
  if(!tx) return;

  if(MPESA_INTEGRATION_LIVE){
    const pin = prompt('Re-enter your 6-digit main admin PIN to confirm this real M-Pesa payout of '+fmtKESRaw(Math.abs(tx.amount))+' to '+formatPhoneKE(tx.phone)+':');
    if(!pin) return;
    let phone254 = tx.phone;
    showToast('Sending payout to Safaricom…');
    try{
      const res = await fetch(FUNCTIONS_URL+'/mpesa-b2c-payout', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY},
        body: JSON.stringify({ withdrawalTxId: txId, phone: phone254, amount: Math.abs(tx.amount), adminPin: pin })
      });
      const json = await res.json();
      if(!res.ok || json.error) throw new Error(json.error || 'Payout failed');
      logAdminAction('Approved withdrawal (M-Pesa payout sent)', tx.name+' · KES '+Math.abs(tx.amount).toLocaleString());
      showToast('Payout sent — will confirm once Safaricom processes it');
      render(); // realtime sync will reflect the final status once mpesa-b2c-callback fires
    }catch(e){
      showToast('Payout failed: '+e.message);
    }
    return;
  }

  // Simulated fallback — used until MPESA_INTEGRATION_LIVE is switched on.
  tx.status='completed';
  tx.mpesaCode = mockMpesaCode();
  logAdminAction('Approved withdrawal', tx.name+' · KES '+Math.abs(tx.amount).toLocaleString());
  await persistData();
  showToast('Withdrawal approved & sent');
  render();
}
async function rejectWithdrawal(txId){
  if(!requireMainAdmin()) return;
  const tx = S.data.transactions.find(t=>t.id===txId);
  if(!tx) return;
  const user = S.data.users[tx.phone];
  if(user) user.balance += Math.abs(tx.amount);
  tx.status='rejected';
  logAdminAction('Rejected withdrawal', tx.name+' · KES '+Math.abs(tx.amount).toLocaleString());
  await persistData();
  showToast('Withdrawal rejected & refunded');
  render();
}
async function changeAdminPin(newPin){
  if(!requireMainAdmin()) return;
  if(!/^\d{6}$/.test(newPin)){ showToast('PIN must be exactly 6 digits'); return; }
  S.data.settings.adminPinHash = await sha256Hex(newPin);
  logAdminAction('Changed main admin PIN', '');
  await persistData();
  showToast('Main admin PIN updated');
  render();
}
async function setJuniorPin(id, newPin){
  if(!requireMainAdmin()) return;
  if(!/^\d{6}$/.test(newPin)){ showToast('PIN must be exactly 6 digits'); return; }
  const slot = S.data.settings.juniorAdmins.find(j=>j.id===id);
  if(!slot) return;
  // A junior PIN can't collide with the main PIN or another junior's PIN.
  const hash = await sha256Hex(newPin);
  if(hash === S.data.settings.adminPinHash || S.data.settings.juniorAdmins.some(j=>j.id!==id && j.pinHash===hash)){
    showToast('That PIN is already in use — choose a different one');
    return;
  }
  const hadPinBefore = !!slot.pinHash;
  slot.pinHash = hash;
  logAdminAction(hadPinBefore ? 'Updated junior admin PIN' : 'Set junior admin PIN', slot.label);
  await persistData();
  showToast(slot.label+' PIN set');
  render();
}
async function clearJuniorPin(id){
  if(!requireMainAdmin()) return;
  const slot = S.data.settings.juniorAdmins.find(j=>j.id===id);
  if(!slot) return;
  slot.pinHash = null;
  logAdminAction('Revoked junior admin access', slot.label);
  await persistData();
  showToast(slot.label+' access revoked');
  render();
}

const CATEGORY_CHART_COLOR = {
  Politics: '#3B6EFF',
  Sports: '#F97316',
  Economy: '#F5C542',
  Weather: '#14B8A6',
  Entertainment: '#C084FC',
};
function marketChart(m){
  const history = m.history;
  if(!history || history.length<2) return '';
  const w=560, h=200, padL=34, padR=10, padT=14, padB=22;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const vals = history.map(pt=>pt.prob);
  const min = Math.max(0, Math.min(...vals)-6);
  const max = Math.min(100, Math.max(...vals)+6);
  const range = (max-min)||1;
  const xFor = i => padL + (i/(history.length-1))*plotW;
  const yFor = v => padT + (1-((v-min)/range))*plotH;
  const first = history[0].prob, last = history[history.length-1].prob;
  const trendUp = last >= first;
  // The line and fill match THIS market's own category color (same identity as
  // its icon and banner elsewhere) — so each market's chart visually belongs to
  // it, rather than every chart looking identical regardless of topic.
  const lineColor = CATEGORY_CHART_COLOR[m.category] || CATEGORY_CHART_COLOR.Politics;
  // Actual up/down movement still shown, just kept to a small trend indicator
  // rather than recoloring the whole chart, so both signals stay legible.
  const trendColor = trendUp ? '#22C55E' : '#FF2E3B';
  const uid = 'mc'+Math.random().toString(36).slice(2,8);

  let linePath = '';
  history.forEach((pt,i)=>{ linePath += (i===0?'M':'L') + xFor(i).toFixed(1) + ',' + yFor(pt.prob).toFixed(1) + ' '; });
  const areaPath = linePath + `L${xFor(history.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${padL},${(padT+plotH).toFixed(1)} Z`;

  const gridLines = [0,25,50,75,100].filter(g=>g>=min-1 && g<=max+1);
  const gridSvg = gridLines.map(g=>{
    const y = yFor(g);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--hairline-strong)" stroke-width="1" stroke-dasharray="2 3"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--muted-2)">${g}%</text>`;
  }).join('');

  const startDate = new Date(history[0].t).toLocaleDateString('en-KE',{day:'numeric',month:'short'});
  const endDate = new Date(history[history.length-1].t).toLocaleDateString('en-KE',{day:'numeric',month:'short'});
  const lastX = xFor(history.length-1), lastY = yFor(last);

  return `<div class="market-chart-wrap" style="border-color:${lineColor}33;">
    <div class="market-chart-head">
      <span class="mc-label" style="color:${lineColor};">${m.category} · Probability over time</span>
      <span class="mc-current" style="color:${trendColor};">${fmtPct(last)} YES ${trendUp?'▲':'▼'}</span>
    </div>
    <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${uid}fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridSvg}
      <path d="${areaPath}" fill="url(#${uid}fill)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="2.25"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="${trendColor}" stroke="#08080B" stroke-width="1.5"/>
      <text x="${padL}" y="${h-6}" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--muted-2)">${startDate}</text>
      <text x="${w-padR}" y="${h-6}" text-anchor="end" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--muted-2)">${endDate}</text>
    </svg>
  </div>`;
}

function probBar(prob){
  const p = clamp(prob,2,98);
  return `<div class="prob-wrap"><div class="prob-bar">
    <div class="prob-yes" style="width:${p}%"><span class="prob-label">${p<12?'':fmtPct(p)+' YES'}</span></div>
    <div class="prob-no" style="width:${100-p}%"><span class="prob-label">${(100-p)<12?'':fmtPct(100-p)+' NO'}</span></div>
  </div></div>`;
}

function marketCard(m){
  const dstatus = marketDisplayStatus(m);
  const badgeText = dstatus==='open' ? 'OPEN' : dstatus==='awaiting' ? 'CLOSED · AWAITING RESULT' : dstatus==='overdue' ? 'RESOLUTION OVERDUE' : 'SETTLED · '+(m.outcome||'').toUpperCase();
  const badgeClass = dstatus==='open' ? 'open' : dstatus==='overdue' ? 'overdue' : 'settled';
  return `<div class="card" onclick="goto('detail',{selectedMarketId:'${m.id}',betSide:'yes',betStake:'',commentDraft:''})" style="cursor:pointer;">
    <div class="eyebrow"><span>${m.category.toUpperCase()}</span><span class="badge ${badgeClass}">${badgeText}</span></div>
    ${marketBanner(m,false)}
    <p class="q-title">${escapeHtml(m.question)}</p>
    ${probBar(m.prob)}
    <div class="card-foot">
      <span>VOL ${fmtKES(m.volume)}</span>
      <span>${(m.comments&&m.comments.length) ? '💬 '+m.comments.length+' · ' : ''}${dstatus==='open' ? 'CLOSES '+fmtDate(m.closesAt).toUpperCase() : dstatus==='overdue' ? 'RESOLUTION OVERDUE' : dstatus==='awaiting' ? 'AWAITING RESULT' : 'SETTLED'}</span>
    </div>
  </div>`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function sparkline(history, opts){
  if(!history || history.length<2) return '';
  const o = opts || {};
  const w=o.w||280, h=o.h||54, pad=4, sw=o.sw||2.5;
  const vals = history.map(pt=>pt.prob);
  const min=Math.min(...vals,0), max=Math.max(...vals,100);
  const range=(max-min)||1;
  const gid = 'spark'+Math.random().toString(36).slice(2,8);
  let d='';
  history.forEach((pt,i)=>{
    const x = pad + (i/(history.length-1))*(w-2*pad);
    const y = pad + (1-((pt.prob-min)/range))*(h-2*pad);
    d += (i===0?'M':'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });
  const stroke = o.color ? o.color : `url(#${gid})`;
  const defs = o.color ? '' : `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3B6EFF"/><stop offset="100%" stop-color="#FF2E3B"/></linearGradient></defs>`;
  return `<div class="sparkline-wrap"><svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>
    ${defs}
  </svg></div>`;
}

function txTypeLabel(t){

}
function txTypeIcon(t){
  return {deposit:'💰',withdrawal:'🏧',bet:'🎯',payout:'🏆',refund:'↩️',referral_bonus:'🎁',admin_sweep:'🏦'}[t]||'•';
}
/* ================= ACTIVITY MONITOR (main admin only) ================= */
// Pulls together every kind of user action into one chronological feed — money moves,
// comments, new signups, and community proposals — so the main admin can see everything
// happening on the platform in one place, not scattered across separate sections.
function buildActivityFeed(){
  const items = [];
  (S.data.transactions||[]).forEach(t=>{
    items.push({
      cat: (t.type==='deposit'||t.type==='withdrawal'||t.type==='bet'||t.type==='payout'||t.type==='refund'||t.type==='referral_bonus'||t.type==='admin_sweep') ? 'money' : 'other',
      icon: txTypeIcon(t.type), at: t.createdAt, actor: t.name || formatPhoneKE(t.phone||'') || '—',
      detail: txTypeLabel(t.type) + (typeof t.amount==='number' ? ' · ' + (t.amount>0?'+':'') + fmtKESRaw(Math.abs(t.amount)) : ''),
    });
  });
  (S.data.markets||[]).forEach(m=>{
    (m.comments||[]).forEach(c=>{
      items.push({
        cat:'comment', icon:'💬', at:c.createdAt, actor:c.name||'—',
        detail: 'Commented on "'+m.question.slice(0,40)+(m.question.length>40?'…':'')+'": "'+c.text.slice(0,60)+(c.text.length>60?'…':'')+'"',
      });
    });
  });
  Object.values(S.data.users||{}).forEach(u=>{
    items.push({ cat:'signup', icon:'🆕', at:u.joinedAt, actor:u.name||formatPhoneKE(u.phone||''), detail:'Joined Predimarket' });
  });
  (S.data.proposals||[]).forEach(p=>{
    items.push({ cat:'proposal', icon:'📝', at:p.createdAt, actor:p.proposedByName||'—', detail:'Proposed a market: "'+p.question.slice(0,50)+(p.question.length>50?'…':'')+'"' });
  });
  items.sort((a,b)=>new Date(b.at)-new Date(a.at));
  return items;
}

}

function viewMyBets(){
  const user = currentUser();
  const allBets = [...user.bets].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const filter = S.portfolioFilter || 'all';
  const bets = filter==='all' ? allBets : allBets.filter(b=>b.status===filter);

  const totalStaked = allBets.reduce((a,b)=>a+b.stake,0);
  const openBets = allBets.filter(b=>b.status==='open');
  const wonBets = allBets.filter(b=>b.status==='won');
  const settled = allBets.filter(b=>b.status==='won'||b.status==='lost');
  const winRate = settled.length ? Math.round(wonBets.length/settled.length*100) : null;
  const openStake = openBets.reduce((a,b)=>a+b.stake,0);

  const filters = [
    {key:'all', label:'All', count:allBets.length},
    {key:'open', label:'Open', count:openBets.length},
    {key:'won', label:'Won', count:wonBets.length},
    {key:'lost', label:'Lost', count:allBets.filter(b=>b.status==='lost').length},
    {key:'refunded', label:'Refunded', count:allBets.filter(b=>b.status==='refunded').length},
  ];

  const betCard = (b) => {
    const sideColor = b.side==='yes' ? 'var(--good)' : 'var(--red)';
    const resultVal = b.status==='won' ? fmtKES(b.payout) : b.status==='refunded' ? fmtKES(b.stake) : fmtKES(b.potentialPayout);
    const resultLabel = b.status==='open' ? 'if it wins' : b.status==='won' ? 'won' : b.status==='refunded' ? 'refunded' : 'potential';
    return `<div class="bet-card">
      <div class="bet-card-top">
        <span class="bet-side-badge" style="background:${sideColor};">${b.side.toUpperCase()}</span>
        <span class="status-pill ${b.status}">${b.status}</span>
      </div>
      <div class="bet-card-q">${escapeHtml(b.question.slice(0,72))}${b.question.length>72?'…':''}</div>
      <div class="bet-card-foot">
        <div><div class="k">Staked</div><div class="v">${fmtKES(b.stake)}</div></div>
        <div><div class="k">${resultLabel}</div><div class="v" style="color:${b.status==='won'?'var(--good)':b.status==='lost'?'var(--red)':'var(--bone)'};">${resultVal}</div></div>
        <div><div class="k">Date</div><div class="v" style="font-size:11.5px;">${fmtDateTime(b.createdAt)}</div></div>
      </div>
    </div>`;
  };

  return `
  <div class="admin-stat-grid">
    <div class="stat-box"><div class="v">${fmtKES(totalStaked)}</div><div class="k">Total staked</div></div>
    <div class="stat-box"><div class="v">${fmtKES(openStake)}</div><div class="k">Currently in play</div></div>
    <div class="stat-box"><div class="v">${winRate!==null?winRate+'%':'—'}</div><div class="k">Win rate</div></div>
    <div class="stat-box"><div class="v">${allBets.length}</div><div class="k">Total bets</div></div>
  </div>

  <div class="cat-row">
    ${filters.map(f=>`<button class="cat-pill ${filter===f.key?'active':''}" onclick="S.portfolioFilter='${f.key}';render()">${f.label}${f.count?' ('+f.count+')':''}</button>`).join('')}
  </div>

  ${bets.length ? bets.map(betCard).join('') : `<div class="empty" style="padding:24px;">${filter==='all' ? 'No bets placed yet — browse Proposals to get started.' : 'Nothing in this category yet.'}</div>`}
  `;
}

/* ================= MASTER RENDER ================= */
function render(){
  const app = document.getElementById('app');
  if(S.loading || !S.data){
    app.innerHTML = `<div class="empty" style="margin-top:80px;"><div class="spinner"></div>Loading Predimarket…</div>${offlineOverlay()}`;
    return;
  }

  // Preserve focus/cursor position across re-render, since a live update from another
  // device can now trigger a render while someone is mid-typing on this one.
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && 'selectionStart' in active) ? active.selectionStart : null;
  const selEnd = (active && 'selectionEnd' in active) ? active.selectionEnd : null;

  let body = '';
  if(S.loadError) body += `<div class="demo-banner" style="border-color:var(--red);"><b>Heads up:</b> ${escapeHtml(S.loadError)}</div>`;
  // Every view below assumes a signed-in user exists. Before someone finishes signing up
  // (no S.session yet), none of them are safe to call — skip straight to just the
  // onboarding modal instead of crashing the whole render on a null user.
  const userViews = new Set(['dashboard','detail','wallet','mybets','referrals','profile']);
  if(!S.session && userViews.has(S.view)){
    body += `<div class="empty" style="margin-top:60px;">👋 Welcome — sign up below to get started.</div>`;
  } else if(S.view==='dashboard') body += viewDashboard();
  else if(S.view==='markets') body += viewMarkets();
  else if(S.view==='detail') body += viewDetail();
  else if(S.view==='wallet') body += viewWallet();
  else if(S.view==='mybets') body += viewMyBets();
  else if(S.view==='referrals') body += viewReferrals();
  else if(S.view==='leaderboard') body += viewLeaderboard();
  else if(S.view==='profile') body += viewProfile();
  else if(S.view==='admin-login') body += viewAdminLogin();
  else if(S.view==='admin') body += isAdmin() ? viewAdmin() : viewAdminLogin();

  app.innerHTML = `
    ${header()}
    <main class="${(S.view==='markets' && S.proposalTab!=='suggest') ? 'wide' : ''}">${body}</main>
    <div class="footer-note">Predimarket · Africa's Largest Prediction Market · Nairobi, Kenya</div>
    ${S.toast ? `<div style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--black-panel-2);border:1px solid var(--hairline-strong);padding:11px 18px;border-radius:100px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);">${escapeHtml(S.toast)}</div>`:''}
    ${S.onboarding ? onboardingModal() : ''}
    ${mpesaModal()}
    ${installAppModal()}
    ${offlineOverlay()}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  scheduleNextMarketCloseCheck();
}

/* ================= INSTALL AS APP ================= */
let deferredInstallPrompt = null;
let pendingInstallOffer = false; // set true right after signup if the browser hasn't fired the event yet
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  // The event can arrive seconds after signup finished — if we were waiting on it, show it now.
  if(pendingInstallOffer && !isRunningStandalone()){
    pendingInstallOffer = false;
    S.installModalType = 'native';
    S.showInstallModal = true;
    render();
  }
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; });

function isRunningStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
// Called right after a successful sign-up so new members get a nudge to install the app.
// Chrome doesn't always have fired beforeinstallprompt by this exact moment, so if it
// hasn't, we mark ourselves as waiting and the listener above catches it when it does arrive.
function offerInstallPrompt(){
  if(isRunningStandalone()) return; // already installed
  try{ if(localStorage.getItem('am_install_dismissed')==='true') return; }catch(e){}
  tryShowInstallNotification();
  if(deferredInstallPrompt){
    S.installModalType = 'native';
    S.showInstallModal = true;
    render();
  } else if(isIOS()){
    S.installModalType = 'ios';
    S.showInstallModal = true;
    render();
  } else {
    // Not ready yet (Chrome hasn't decided the site is installable, or hasn't finished its
    // own checks) — keep waiting for a short window in case it fires a moment later.
    pendingInstallOffer = true;
    setTimeout(()=>{ pendingInstallOffer = false; }, 15000);
  }
}
// Real OS-level notification (appears in the phone's notification shade, over other apps),
// separate from the in-app popup above. Requires the browser to grant notification
// permission — most Android Chrome/Edge users get a quick native "Allow?" prompt for this.
// Not supported by iOS Safari until the site is already installed, so the in-app modal
// above remains the reliable path there.
function tryShowInstallNotification(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if(Notification.permission === 'denied') return;
  const fire = ()=>{
    navigator.serviceWorker.ready.then((reg)=>{
      reg.showNotification('Install Predimarket', {
        body: 'Tap here to add it to your Home Screen — one-tap access, no app store needed.',
        icon: '/icon-192.png',
        badge: '/icon-192.png',
        tag: 'install-app',
        vibrate: [80]
      }).catch(()=>{});
    }).catch(()=>{});
  };
  if(Notification.permission === 'granted') fire();
  else Notification.requestPermission().then((perm)=>{ if(perm==='granted') fire(); }).catch(()=>{});
}
function manualInstallTrigger(){
  if(deferredInstallPrompt){
    confirmInstall();
  } else if(isIOS()){
    S.installModalType = 'ios';
    S.showInstallModal = true;
    render();
  } else {
    showToast("Your browser hasn't made install available yet — try Chrome or Edge on Android, or reload and try again shortly.");
  }
}
async function confirmInstall(){
  if(deferredInstallPrompt){
    S.showInstallModal = false;
    render();
    deferredInstallPrompt.prompt();
    try{ await deferredInstallPrompt.userChoice; }catch(e){}
    deferredInstallPrompt = null;
  }
}
function dismissInstallModal(){
  S.showInstallModal = false;
  try{ localStorage.setItem('am_install_dismissed','true'); }catch(e){}
  render();
}
function installAppModal(){
  if(!S.showInstallModal) return '';
  const ios = S.installModalType==='ios';
  return `<div class="modal-bg"><div class="modal-sheet">
    <div style="font-size:34px;text-align:center;margin-bottom:8px;">📲</div>
    <p class="modal-title" style="text-align:center;">Install Predimarket</p>
    <p class="modal-sub" style="text-align:center;">
      ${ios
        ? 'Add this to your Home Screen for the full app experience: tap the <b style="color:var(--bone);">Share</b> icon below, then <b style="color:var(--bone);">"Add to Home Screen."</b>'
        : 'Get one-tap access from your Home Screen, just like a native app — no app store needed.'}
    </p>
    ${ios
      ? `<button class="btn btn-blue" onclick="dismissInstallModal()">Got it</button>`
      : `<button class="btn btn-blue" onclick="confirmInstall()">Install app</button>
         <button class="btn btn-ghost" onclick="dismissInstallModal()">Not now</button>`}
  </div></div>`;
}
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
}

/* ================= ONLINE-ONLY ACCESS ================= */
// This app deals with real balances, live odds, and (once switched on) real M-Pesa money —
// showing someone a stale cached balance while offline could be actively misleading, so we
// block the app entirely rather than silently letting them interact with old data.
function updateOnlineStatus(){
  S.isOnline = navigator.onLine;
  if(S.isOnline && !S.data){
    // We were offline at boot and never actually loaded anything — do it now.
    S.loading = true;
    render();
    loadAll();
    return;
  }
  if(S.isOnline){
    // Coming back from any offline period — don't assume realtime caught up on
    // whatever changed while we were disconnected. Pull fresh data explicitly.
    refreshData();
  }
  render();
}
// Safety net alongside realtime push: if the realtime subscription silently dropped
// (happens more than you'd expect — backgrounded tabs, network hiccups that don't
// always fire a clean 'offline' event, Replication not enabled on the table yet), this
// guarantees data is never more than a minute stale.
setInterval(()=>{ if(S.isOnline) refreshData(); }, 45000);
// Mobile browsers/PWAs often freeze JS timers while backgrounded — catch up immediately
// the moment the app is looked at again, rather than waiting for the next poll tick.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && S.isOnline) refreshData();
});
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
function offlineOverlay(){
  if(S.isOnline) return '';
  return `<div class="modal-bg" style="z-index:500;">
    <div class="modal-sheet" style="text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">📡</div>
      <p class="modal-title">You're offline</p>
      <p class="modal-sub">Predimarket needs an internet connection — this keeps your balance, odds, and bets accurate instead of showing you stale data. Reconnect to continue.</p>
      <button class="btn btn-blue" onclick="updateOnlineStatus()">Try again</button>
    </div>
  </div>`;
}

/* ================= BOOT ================= */
async function boot(){
  await initSupabaseClient();
  S.isOnline = navigator.onLine;
  loadAll();
  registerServiceWorker();
}
boot();
</script>
